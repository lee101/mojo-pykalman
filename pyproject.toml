[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-pykalman"
version = "0.1.0"
description = "Mojo-accelerated Kalman smoothing and EM"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]
license = "MIT"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
